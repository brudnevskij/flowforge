[package]
name = "api"
version = "0.1.0"
edition = "2024"

[dependencies]
app = { path = "../app" }
domain = { path = "../domain" }
infra = {path = "../infra"}


axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
